baseURL: https://myblog-3q6.pages.dev/
defaultContentLanguage: zh-tw
hasCJKLanguage: true

pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# 所有語言共用
params:
  env: production
  images: ["/example.png"] # 圖標 [ og:image ] ( 修改 )
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: true
  hidemeta: false
  hideSummary: false
  disableSpecial1stPost: true

  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  showtoc: false
  tocopen: false

  # 你的網頁標題旁邊的圖標 ( 修改 )
  assets:
    favicon: "/example.png"
    favicon16x16: "/example.png"
    favicon32x32: "/example.png"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

# 各語言各自的內容
languages:
  zh-tw:
    label: "中文" # 切換按鈕上的文字 ( 修改 )
    locale: zh-TW
    contentDir: content/zh-tw
    weight: 1
    title: ExampleSite # 你的網頁標題 [ og:site_name / 首頁 og:title ] ( 修改 )
    params:
      description: "ExampleSite description" # 敘述 [ og:description ] ( 修改 )
      keywords: [部落格, 筆記] # 關鍵字 ( 修改 )
      author: Me # 作者名稱 ( 修改 )
      DateFormat: "2006 年 1 月 2 日"
      label:
        text: "Home" # LOGO 文字 ( 修改 )
        icon: /example.png # Logo 圖片 ( 修改 )
        iconHeight: 35
      # 首頁自我介紹 ( 修改 )
      homeInfoParams:
        Title: "你想講的一句話" # 首頁標題 ( 修改 )
        Content: |
          第一段自我介紹

          第二段自我介紹
      # 首頁下方的社群圖示 ( 修改 )
      socialIcons:
        - name: instagram
          url: "https://www.instagram.com/"
    menu:
      main:
        - identifier: posts
          name: Post
          url: /posts/
          weight: 10

  en:
    label: "English" # 切換按鈕上的文字 ( 修改 )
    locale: en-US
    contentDir: content/en
    weight: 2
    title: ExampleSite # Site title [ og:title ] ( 修改 )
    params:
      description: "ExampleSite description" # [ og:description ] ( 修改 )
      keywords: [Blog, Notes] # ( 修改 )
      author: Me # ( 修改 )
      DateFormat: "January 2, 2006"
      label:
        text: "Home" # ( 修改 )
        icon: /example.png
        iconHeight: 35
      # 英文版首頁自我介紹 ( 修改 )
      homeInfoParams:
        Title: "Your one-line tagline"
        Content: |
          First paragraph of your introduction

          Second paragraph of your introduction
      socialIcons:
        - name: instagram
          url: "https://www.instagram.com/"
    menu:
      main:
        - identifier: posts
          name: Post
          url: /en/posts/
          weight: 10

pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML, e.g. <img width="300">
    parser:
      wrapStandAloneImageWithinParagraph: false # required for image attributes below
      attribute:
        block: true # allow {width="300"} on the line after an image
  highlight:
    noClasses: false
